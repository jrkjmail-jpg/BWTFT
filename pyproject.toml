[project]
name = "bwtft"
version = "0.1.0"
description = "Telegram bot for personalized children's books and illustration prompts."
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.7,<4",
    "openai>=1.30,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "sqlalchemy>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
bwtft-bot = "bwtft_bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bwtft_bot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
